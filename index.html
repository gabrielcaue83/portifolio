<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cauê Gabriel — Design, Motion &amp; Sites</title>
    <meta name="description" content="Identidade visual, motion design, animação vetorial e sites com GSAP e Three.js. Fale com Cauê Gabriel." />
    <meta name="theme-color" content="#B6FF3B" />
    <meta property="og:title" content="Cauê Gabriel — Design, Motion &amp; Sites" />
    <meta property="og:description" content="Marcas, animações vetoriais e sites que se mexem de verdade." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Se o JS principal nem carregar (arquivo 404, navegador antigo), mostra o motivo em vez de tela branca
      window.addEventListener(
        'error',
        function (e) {
          var root = document.getElementById('root')
          if (!root || root.childNodes.length) return
          var what = e.target && e.target.src ? 'Falha ao carregar ' + e.target.src : e.message
          root.innerHTML =
            '<pre style="margin:16px;padding:16px;border:4px solid #000;background:#ffe600;white-space:pre-wrap;font:16px monospace">Erro ao iniciar o site:\n' +
            what +
            '</pre>'
        },
        true,
      )
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
